openapi: 3.0.3
info:
  title: Cornerstone Alumni System API
  version: 1.0.0
  description: API documentation for the Cornerstone Alumni management system.
paths:
  /api/alumni/:
    get:
      operationId: alumni_list
      description: List ALL ACTIVE alumni (registered and pending).
      tags:
      - alumni
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlumniList'
          description: ''
  /api/alumni/{id}/archive/:
    post:
      operationId: alumni_archive_create
      description: Archive an alumni record. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - alumni
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumniStatusResponse'
          description: ''
  /api/alumni/{id}/edit/:
    put:
      operationId: alumni_edit_update
      description: Edit an existing alumni record. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - alumni
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PersonRequest'
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
    patch:
      operationId: alumni_edit_partial_update
      description: Edit an existing alumni record. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - alumni
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPersonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPersonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPersonRequest'
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
  /api/alumni/{id}/unarchive/:
    post:
      operationId: alumni_unarchive_create
      description: Unarchive an alumni record. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - alumni
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumniStatusResponse'
          description: ''
  /api/alumni/add/:
    post:
      operationId: alumni_add_create
      description: Add a new alumni record. Admin only.
      tags:
      - alumni
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAddAlumniRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAddAlumniRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAddAlumniRequest'
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
  /api/alumni/archived/:
    get:
      operationId: alumni_archived_list
      description: List ALL ARCHIVED alumni. Admin only.
      tags:
      - alumni
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlumniList'
          description: ''
  /api/alumni/directory/:
    get:
      operationId: alumni_directory_list
      description: |-
        Public-facing alumni directory.
        Only shows alumni who have successfully registered an account.
      tags:
      - alumni
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisteredAlumni'
          description: ''
  /api/alumni/female/:
    get:
      operationId: alumni_female_list
      description: List all FEMALE alumni who have NOT registered yet.
      tags:
      - alumni
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlumniList'
          description: ''
  /api/alumni/male/:
    get:
      operationId: alumni_male_list
      description: List all MALE alumni who have NOT registered yet.
      tags:
      - alumni
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlumniList'
          description: ''
  /api/events/admin/events/:
    get:
      operationId: events_admin_events_list
      tags:
      - events
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          description: ''
    post:
      operationId: events_admin_events_create
      description: 'Admin: Create a new event.'
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/admin/events/{id}/:
    get:
      operationId: events_admin_events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this event.
        required: true
      tags:
      - events
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    put:
      operationId: events_admin_events_update
      description: 'Admin: Update an event.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this event.
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    patch:
      operationId: events_admin_events_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this event.
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    delete:
      operationId: events_admin_events_destroy
      description: 'Admin: Delete an event.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this event.
        required: true
      tags:
      - events
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '204':
          description: No response body
  /api/events/user/events/:
    get:
      operationId: events_user_events_list
      description: 'User: List all upcoming events.'
      tags:
      - events
      security:
      - tokenAuth: []
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          description: ''
  /api/events/user/events/{event_id}/rsvp/:
    post:
      operationId: events_user_events_rsvp_create
      description: 'User: RSVP to an event. If already RSVPed, it will toggle/remove
        the RSVP.'
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - events
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RSVPResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RSVPResponse'
          description: ''
  /api/onboarding/login/:
    post:
      operationId: onboarding_login_create
      description: Login a user and return session details.
      tags:
      - Auth & Onboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/onboarding/password-reset/:
    post:
      operationId: onboarding_password_reset_create
      description: Initiate password reset process.
      tags:
      - Auth & Onboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/onboarding/password-reset-confirm/:
    post:
      operationId: onboarding_password_reset_confirm_create
      description: Confirm password reset with token.
      tags:
      - Auth & Onboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/onboarding/password-reset/request-otp/:
    post:
      operationId: onboarding_password_reset_request_otp_create
      description: 'Step 1: Request OTP for password reset. An OTP will be sent to
        the user''s email.'
      tags:
      - Auth & Onboarding - OTP Password Reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/onboarding/password-reset/set-password/:
    post:
      operationId: onboarding_password_reset_set_password_create
      description: 'Step 3: Set a new password using the verified OTP.'
      tags:
      - Auth & Onboarding - OTP Password Reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetSetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetSetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetSetPasswordRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/onboarding/password-reset/verify-otp/:
    post:
      operationId: onboarding_password_reset_verify_otp_create
      description: 'Step 2: Verify the OTP sent to the user''s email.'
      tags:
      - Auth & Onboarding - OTP Password Reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyOTPRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/onboarding/register/:
    post:
      operationId: onboarding_register_create
      description: Registers an alumni. If the record is found, an account is created.
        If not found, a SignupRequest is created for admin review.
      tags:
      - Auth & Onboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAlumniRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterAlumniRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterAlumniRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/onboarding/signup-request/:
    post:
      operationId: onboarding_signup_request_create
      description: Explicitly submit a signup request for admin review.
      tags:
      - Auth & Onboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequestRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupRequest'
          description: ''
  /api/onboarding/signup-requests/{id}/approve/:
    post:
      operationId: onboarding_signup_requests_approve_create
      description: Approve a signup request. Creates User and Person records. Admin
        only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Signup Requests
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/onboarding/signup-requests/{id}/delete/:
    delete:
      operationId: onboarding_signup_requests_delete_destroy
      description: Delete a signup request permanently. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Signup Requests
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '204':
          description: No response body
  /api/onboarding/signup-requests/{id}/reject/:
    post:
      operationId: onboarding_signup_requests_reject_create
      description: Reject a signup request. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Signup Requests
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/onboarding/signup-requests/pending/:
    get:
      operationId: onboarding_signup_requests_pending_list
      description: List all pending signup requests. Admin only.
      tags:
      - Admin - Signup Requests
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSignupRequest'
          description: ''
  /api/opportunities/:
