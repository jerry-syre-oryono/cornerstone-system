          description: ''
  /api/resources/{id}/:
    get:
      operationId: resources_retrieve
      description: Get details of a single resource.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - resources
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
          description: ''
  /api/resources/upload/:
    post:
      operationId: resources_upload_create
