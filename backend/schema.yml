      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/users/female/:
    get:
      operationId: users_female_list
      description: List all FEMALE users who have registered/onboarded.
      tags:
