  /api/opportunities/{id}/:
    get:
      operationId: opportunities_retrieve
      description: Get details of a single opportunity.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - opportunities
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
          description: ''
  /api/opportunities/create/:
    post:
      operationId: opportunities_create_create
      description: Create a new opportunity.
      tags:
      - opportunities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpportunityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpportunityRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
          description: ''
  /api/resources/:
    get:
      operationId: resources_list
