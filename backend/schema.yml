      - resources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
        required: true
      security:
      - tokenAuth: []
      - TokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
          description: ''
  /api/users/{id}/set-role/:
    post:
      operationId: users_set_role_create
      description: Promote or demote a user. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRoleRequest'
          multipart/form-data:
